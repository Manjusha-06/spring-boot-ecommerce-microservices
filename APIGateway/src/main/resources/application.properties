spring.application.name=APIGateway


server.port=8000


#optional
eureka.instance.appname=api-gateway-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8001
#checking for condition we use predicates
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8002
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/product/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8003
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/order/**

#actuator properties
management.endpoints.web.exposure.include=*
management.info.env.enabled=true

info.app.name=api-service
info.app.description= api gateway project
info.app.version=1.0